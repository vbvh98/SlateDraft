name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/update (e.g. v1.0.0). Defaults to v<version> from tauri.conf.json.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  create-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.ensure-release.outputs.release_id }}
      tag_name: ${{ steps.ensure-release.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure GitHub release exists
        id: ensure-release
        uses: actions/github-script@v7
        env:
          INPUT_TAG: ${{ inputs.tag }}
        with:
          script: |
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            const inputTag = (process.env.INPUT_TAG || '').trim();
            const tagName = context.eventName === 'workflow_dispatch'
              ? (inputTag || `v${config.version}`)
              : process.env.GITHUB_REF_NAME;

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            let release = releases.find((r) => r.tag_name === tagName);
            if (!release) {
              const { data } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tagName,
                target_commitish: context.sha,
                name: `SlateDraft Studio ${tagName}`,
                body: 'Cross-platform desktop installers for SlateDraft Studio. See the assets below for macOS (Apple Silicon & Intel), Windows, and Linux.',
                draft: true,
                prerelease: false,
              });
              release = data;
            }

            core.setOutput('release_id', String(release.id));
            core.setOutput('tag_name', tagName);

  publish-tauri:
    name: Build & Attach (${{ matrix.label }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - label: macOS Intel
            platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - label: Windows x64
            platform: windows-latest
            args: ''
          - label: Linux x86_64
            platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux Tauri system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils file

      - name: Install Node dependencies
        run: npm ci

      - name: Configure code signing environment
        shell: bash
        env:
          _TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          _TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          _APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          _APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          _APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          _APPLE_ID: ${{ secrets.APPLE_ID }}
          _APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          _APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          _WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          _WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          export_env_var() {
            local name="$1"
            local val="$2"
            local delim="__EOF_${name}_$(date +%s)_$$__"
            {
              echo "${name}<<${delim}"
              printf '%s\n' "$val"
              echo "${delim}"
            } >> "$GITHUB_ENV"
          }

          if [ -n "$_TAURI_SIGNING_PRIVATE_KEY" ]; then
            export_env_var "TAURI_SIGNING_PRIVATE_KEY" "$_TAURI_SIGNING_PRIVATE_KEY"
            if [ -n "$_TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
              export_env_var "TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$_TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            fi
          fi

          if [ "${{ runner.os }}" = "macOS" ] && [ -n "$_APPLE_CERTIFICATE" ] && [ -n "$_APPLE_SIGNING_IDENTITY" ]; then
            tmp_p12="${RUNNER_TEMP}/apple_cert_check.p12"
            if python3 -c 'import base64, os, sys; raw = "".join(os.environ["_APPLE_CERTIFICATE"].split()); data = base64.b64decode(raw, validate=True); assert len(data) > 0; open(sys.argv[1], "wb").write(data)' "$tmp_p12" 2>/dev/null \
              && (openssl pkcs12 -info -in "$tmp_p12" -noout -passin "env:_APPLE_CERTIFICATE_PASSWORD" >/dev/null 2>&1 \
                || openssl pkcs12 -legacy -info -in "$tmp_p12" -noout -passin "env:_APPLE_CERTIFICATE_PASSWORD" >/dev/null 2>&1); then
              export_env_var "APPLE_CERTIFICATE" "$_APPLE_CERTIFICATE"
              export_env_var "APPLE_CERTIFICATE_PASSWORD" "$_APPLE_CERTIFICATE_PASSWORD"
              export_env_var "APPLE_SIGNING_IDENTITY" "$_APPLE_SIGNING_IDENTITY"
              if [ -n "$_APPLE_ID" ] && [ -n "$_APPLE_PASSWORD" ] && [ -n "$_APPLE_TEAM_ID" ]; then
                export_env_var "APPLE_ID" "$_APPLE_ID"
                export_env_var "APPLE_PASSWORD" "$_APPLE_PASSWORD"
                export_env_var "APPLE_TEAM_ID" "$_APPLE_TEAM_ID"
              fi
              echo "macOS code signing enabled."
            else
              echo "::warning::APPLE_CERTIFICATE secret is not a valid PKCS#12 (.p12) bundle or password did not match; building unsigned macOS bundle."
            fi
            rm -f "$tmp_p12"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            echo "No Apple Developer signing secrets configured; building unsigned macOS bundle."
          fi

          if [ "${{ runner.os }}" = "Windows" ] && [ -n "$_WINDOWS_CERTIFICATE" ]; then
            export_env_var "WINDOWS_CERTIFICATE" "$_WINDOWS_CERTIFICATE"
            if [ -n "$_WINDOWS_CERTIFICATE_PASSWORD" ]; then
              export_env_var "WINDOWS_CERTIFICATE_PASSWORD" "$_WINDOWS_CERTIFICATE_PASSWORD"
            fi
            echo "Windows code signing enabled."
          fi

      - name: Build and attach Tauri release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ needs.create-release.outputs.tag_name }}
          includeUpdaterJson: false
          retryAttempts: 2
          args: ${{ matrix.args }}

  publish-release:
    name: Publish GitHub Release
    needs: [create-release, publish-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release with attached assets
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const releaseId = Number(process.env.RELEASE_ID);
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              per_page: 100,
            });
            if (assets.length === 0) {
              core.setFailed('No release assets were attached to the release.');
              return;
            }
            const { data: release } = await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              draft: false,
            });
            core.info(`Published release ${release.html_url} with ${assets.length} asset(s):`);
            for (const asset of assets) {
              core.info(`- ${asset.name} (${asset.browser_download_url})`);
            }
